[project]
name = "rap-bench"
version = "0.1.0"
description = "MMLU: Marshall Mathers Lyrical Understanding — how fast a rapper can open-source ASR survive?"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "jiwer>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fetch = ["yt-dlp"]
separate = ["demucs"]
whisper = ["faster-whisper", "av<16"]  # av 16+ dropped the metadata_errors kwarg faster-whisper 1.2.1 passes
hf = ["transformers", "torch", "torchaudio"]
mlx = ["mlx-whisper", "parakeet-mlx"]
analysis = ["wordfreq"]  # bootstrap_ci.py --adjust vocab

[tool.setuptools]
packages = ["rapbench"]
