# rap-bench segment manifest
#
# Each segment is a short excerpt (<60s) of a commercially released track,
# scored against hand-verified lyrics in lyrics/<id>.txt.
#
# Fields:
#   url        — source to download (fill in yourself; yt-dlp compatible).
#                Left null in the published repo: bring your own audio.
#   start/end  — excerpt bounds in seconds, relative to the source at `url`.
#                Timestamps below are approximate until verified: true.
#   syl_per_sec — approximate peak syllable rate, for the difficulty ladder.
#   tier       — control | baseline | fast | insane
#
# verified: false means BOTH the timestamps and the lyric file still need a
# human pass. Do not trust scores from unverified segments.

segments:
  - id: interview-control
    artist: Eminem
    track: "(any interview clip — conversational speech control)"
    url: null
    start: 0
    end: 45
    syl_per_sec: 4.0
    tier: control
    verified: false
    notes: >
      Clean-speech control with the same voice. Separates "ASR struggles with
      music" from "ASR struggles with speed". Pick any interview segment and
      transcribe it by hand for ground truth.

